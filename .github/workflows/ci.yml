name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workflow JSON is in sync with src/
        run: python3 build.py && git diff --exit-code workflows/
      - name: Code-node unit tests
        run: node --test tests/*.test.mjs
